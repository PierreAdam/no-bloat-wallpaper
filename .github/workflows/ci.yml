name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job may write (to publish the release).
permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag is in the comment), so a moved or
# compromised tag cannot change what runs here. Dependabot or Renovate can keep them current.
jobs:
  # The CLI compiles everywhere. Linux and macOS cannot set a wallpaper yet,
  # so they are build checks only and nothing from them is released.
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path gui/src-tauri/Cargo.toml
      # With and without the GUI-only previews, so both builds stay warning-free.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features thumbnails -- -D warnings
      - run: cargo clippy --manifest-path gui/src-tauri/Cargo.toml --target-dir target -- -D warnings
      - run: cargo test
      - run: cargo test --features thumbnails
      - run: node scripts/check-translations.js
      # Builds nbw, nbw-gui, the NSIS installer and the portable zip (the Tauri bundler
      # version is pinned in build.ps1).
      - run: ./build.ps1 -Package
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/no-bloat-wallpaper-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      # One flat folder, plus SHA-256 checksums so downloads can be verified.
      - run: |
          mkdir release
          find dist -type f -exec mv {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          generate_release_notes: true
