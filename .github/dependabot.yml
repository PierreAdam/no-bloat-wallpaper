# Weekly pull requests to keep the pinned actions and the Rust dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /gui/src-tauri
    schedule:
      interval: weekly
