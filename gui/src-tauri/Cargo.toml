[package]
name = "nbw-gui"
version = "0.1.0"
edition = "2021"
description = "No Bloat Wallpaper app: settings window, optional tray icon, and the scheduled runs (--task)"
license = "MIT"

[[bin]]
name = "nbw-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
no-bloat-wallpaper = { path = "../..", features = ["thumbnails"] }

# Standalone workspace so the GUI never affects the lean CLI build.
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Unwind (not abort): a panic while decoding one broken picture fails that preview only.
panic = "unwind"
strip = true
