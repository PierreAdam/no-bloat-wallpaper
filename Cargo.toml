[package]
name = "no-bloat-wallpaper"
version = "0.1.0"
edition = "2021"
rust-version = "1.89" # std::fs::File::lock
description = "A tiny, scheduler-driven wallpaper rotator. No resident process (the tray icon is optional)."
license = "MIT"
repository = "https://github.com/PierreAdam/no-bloat-wallpaper"

[[bin]]
name = "nbw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = "3"
# Only the GUI makes small previews (feature "thumbnails"); the CLI stays lean.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "bmp"] }

[features]
thumbnails = ["dep:image"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Globalization"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
